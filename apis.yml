name: Double Click
description: >-
  DoubleClick was an interactive marketing and advertising technology company founded in 1996 by
  Kevin O'Connor and Dwight Merriman. It pioneered ad serving, targeting, and campaign measurement for
  publishers and advertisers, went public on NASDAQ as DCLK, and was acquired by Google in 2008 for
  roughly $3.1 billion. Its products were folded into Google's advertising stack — DoubleClick for
  Publishers became Google Ad Manager and DoubleClick Digital Marketing became the Google Marketing
  Platform. DoubleClick no longer exists as an independent company or API provider; doubleclick.com now
  redirects to Google Marketing Platform. This API Evangelist profile is retained as a historical
  venture-portfolio record (surfaced via lightspeed-venture-partners) rather than a live, enrichable
  developer surface.
